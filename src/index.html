<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐厅点餐系统</title>
    <style>
        /* 基础重置 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 背景图设置 */
        .bg-image {
            /* 这里我使用了一张网络的高清美食占位图，你可以把url()里的链接换成你自己的本地图片路径，例如 url('bg.jpg') */
            background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            height: 100%;
            
            /* 使用 Flexbox 让内容居中 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* 半透明的黑色内容框，让文字在复杂背景上更清晰 */
        .container {
            background: rgba(0, 0, 0, 0.65);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            width: 80%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 2.2em;
            letter-spacing: 2px;
        }

        /* 桌号显示样式 */
        .table-info {
            font-size: 1.6em;
            margin-bottom: 40px;
            color: #FFD700; /* 金黄色 */
            font-weight: bold;
            min-height: 35px;
        }

        /* 按钮容器 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 按钮通用样式 */
        button {
            border: none;
            padding: 18px 30px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Start Ordering 按钮 (主色调：鲜艳的橙红色) */
        .btn-start {
            background-color: #FF5722;
            color: white;
        }

        .btn-start:hover {
            background-color: #E64A19;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 87, 34, 0.4);
        }

        /* Check Ordering 按钮 (副色调：蓝色) */
        .btn-check {
            background-color: #03A9F4;
            color: white;
        }

        .btn-check:hover {
            background-color: #0288D1;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(3, 169, 244, 0.4);
        }
    </style>
</head>
<body>

    <div class="bg-image">
        <div class="container">
            <h1>欢迎光临</h1>
            
            <!-- 这里用于动态显示桌号 -->
            <div class="table-info" id="tableDisplay">正在识别桌号...</div>

            <div class="btn-group">
                <button class="btn-start" onclick="startOrdering()">Start Ordering</button>
                <button class="btn-check" onclick="checkOrdering()">Check Ordering</button>
            </div>
        </div>
    </div>

    <script>
        // --- 核心逻辑：自动侦测桌号 ---
        // 顾客扫码时，URL通常是这样的格式： index.html?table=8
        
        function detectTableNumber() {
            // 获取当前网址中的参数
            const urlParams = new URLSearchParams(window.location.search);
            const tableNum = urlParams.get('table'); // 抓取 "table" 后面的值
            
            const displayElement = document.getElementById('tableDisplay');

            if (tableNum) {
                // 如果成功抓取到桌号
                displayElement.innerText = '当前桌位：Table ' + tableNum;
                // 将桌号保存在浏览器的 Session 中，这样点餐页面和结账页面也能读取到是几号桌
                sessionStorage.setItem('currentTable', tableNum);
            } else {
                // 如果直接打开网页，没有带桌号参数
                displayElement.innerText = '未检测到桌号，请扫码点餐';
                displayElement.style.color = '#ff6b6b';
            }
        }

        // 当网页加载完成时，立刻执行侦测功能
        window.onload = detectTableNumber;

        // 点击 Start Ordering 的事件
        function startOrdering() {
            const tableNum = sessionStorage.getItem('currentTable');
            if(!tableNum) {
                alert("请使用微信/相机扫描桌上的专属二维码以获取桌号！");
                return;
            }
            
            // 以后这里可以替换成跳转到你的菜单页面，比如：
            // window.location.href = "menu.html";
            alert("桌号已确认：" + tableNum + "。准备跳转到点餐页面...");
        }

        // 点击 Check Ordering 的事件
        function checkOrdering() {
            const tableNum = sessionStorage.getItem('currentTable');
            if(!tableNum) {
                alert("请使用微信/相机扫描桌上的专属二维码以获取桌号！");
                return;
            }
            
            // 以后这里可以替换成跳转到你的订单查询页面，比如：
            // window.location.href = "order.html";
            alert("桌号已确认：" + tableNum + "。准备跳转到订单查询页面...");
        }
    </script>
</body>
</html>
